trace:
  title: Pause autoscaling
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: load naming
    type: script
    file: "$SERVICE_PATH/naming/resolve_names"
    output:
      - name: np_naming_lookup
        type: function
        parameters:
          kind: string
          namespace: string
          deployment_id: string
  - name: pause autoscaling
    type: script
    file: "$SERVICE_PATH/scope/pause_autoscaling"
