trace:
  title: Pause autoscaling
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: load resource helpers
    type: script
    file: "$SERVICE_PATH/scope/require_resource"
    output:
      - name: require_resource
        type: function
        parameters:
          kind: string
          namespace: string
          deployment_id: string
          out_var: string
  - name: pause autoscaling
    type: script
    file: "$SERVICE_PATH/scope/pause_autoscaling"
