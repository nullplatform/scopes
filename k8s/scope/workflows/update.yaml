include:
  - "$SERVICE_PATH/scope/workflows/create.yaml"
trace:
  title: Update scope
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE"]
  # Per-provider identity: jobs are scoped to the scope's service
  # specification, so two providers sharing a workflow name never
  # converge on one definition.
  job:
    name: k8s-scope-update
    namespace: "@context:scope.provider"
    # Identity labels, the same grammar the deployment workflows declare:
    # `entity` + `scope.provider` scope the search, `operation` names the
    # lifecycle act. They are how a consumer finds this plan BEFORE the run
    # exists, instead of an empty canvas until the agent picks the command up.
    labels:
      entity: scope
      operation: update
      scope.provider: "@context:scope.provider"
steps:
  - name: networking
    type: workflow
    steps:
      - name: generate domain
        action: skip