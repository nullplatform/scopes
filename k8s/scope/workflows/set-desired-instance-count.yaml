trace:
  title: Set the instance count
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: load naming
    type: script
    file: "$SERVICE_PATH/naming/resolve_names"
    output:
      - name: np_naming_lookup
        type: function
        parameters:
          kind: string
          namespace: string
          deployment_id: string
  - name: load resource helpers
    type: script
    file: "$SERVICE_PATH/scope/require_resource"
    output:
      - name: require_resource
        type: function
        parameters:
          kind: string
          namespace: string
          deployment_id: string
          out_var: string
  - name: set desired instance count
    type: script
    file: "$SERVICE_PATH/scope/set_desired_instance_count"
