include:
  - "$SERVICE_PATH/values.yaml"
trace:
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE"]
  # Per-provider identity: jobs are scoped to the scope's service
  # specification, so two providers sharing a workflow name never
  # converge on one definition.
  job:
    name: k8s-scope-delete
    namespace: "@context:scope.provider"
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    trace: false
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/scope/build_context"
    output:
      - name: CONTEXT
        type: environment
      - name: SCOPE_VISIBILITY
        type: environment
      - name: SCOPE_DOMAIN
        type: environment
      - name: OUTPUT_DIR
        type: environment
  - name: networking
    type: workflow
    steps:
      - name: delete dns
        type: script
        file: "$SERVICE_PATH/scope/networking/dns/manage_dns"
        trace:
          title: Delete DNS records
        configuration:
          ACTION: DELETE
        pre:
          name: build dns context
          type: script
          file: "$SERVICE_PATH/scope/networking/dns/build_dns_context"
          trace: false
          output:
            - name: HOSTED_PUBLIC_ZONE_ID
              type: environment
            - name: HOSTED_PRIVATE_ZONE_ID
              type: environment
  - name: iam
    type: workflow
    steps:
      - name: build service account
        type: script
        file: "$SERVICE_PATH/scope/iam/build_service_account"
        # Template generation — the delete below is the observable act.
        trace: false
        configuration:
          ACTION: delete
        output:
          - name: SERVICE_ACCOUNT_TEMPLATE_PATH
            type: file
            file: "$OUTPUT_DIR/service_account-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
      - name: apply
        type: script
        file: "$SERVICE_PATH/apply_templates"
        trace:
          key: remove-service-account
          title: Remove service account
        configuration:
          ACTION: delete
          DRY_RUN: false
      - name: delete role
        type: script
        file: "$SERVICE_PATH/scope/iam/delete_role"
        trace:
          title: Delete IAM role