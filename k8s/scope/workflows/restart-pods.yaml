trace:
  title: Restart the instances
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: load resource helpers
    type: script
    file: "$SERVICE_PATH/scope/require_resource"
    output:
      - name: find_deployment_by_label
        type: function
        parameters:
          scope_id: string
          deployment_id: string
          namespace: string
  - name: restart pods
    type: script
    file: "$SERVICE_PATH/scope/restart_pods"
