trace:
  title: Read Kubernetes objects
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: read
    type: script
    file: "$SERVICE_PATH/scope/k8s_read"
