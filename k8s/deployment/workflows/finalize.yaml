include:
  - "$SERVICE_PATH/values.yaml"
configuration:
  INGRESS_TEMPLATE: "$INITIAL_INGRESS_PATH"
trace:
  title: Finalize deployment
  # The scope's deploy strategy is a flavor DIMENSION: steps that only one
  # strategy can ever run gate on it, so a checklist never advertises work
  # this execution cannot do. Absent config reads as not-rolling, which is
  # the same default the scripts take.
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE", "@context:providers.scope-configurations.deployment.deployment_strategy"]
  # Declared steps only: engine fragments without a trace block (override
  # plumbing) stay off the wire — the fold shows real observable acts, not
  # 0ms no-ops. Script-emitted child steps (per-manifest applies) are
  # unaffected.
  default: false
  # Per-provider identity: jobs are scoped to the scope's service
  # specification, so two providers sharing a workflow name never
  # converge on one definition.
  job:
    name: k8s-deployment-finalize
    namespace: "@context:scope.provider"
    # Identity labels, the same grammar the deploy workflows declare: `entity` +
    # `scope.provider` scope the search, and `operation` names the lifecycle act this
    # job performs — the word the deployment entity's own statuses use. They are how
    # the deployment page finds this plan BEFORE the run exists: a cancel shows the
    # rollback checklist pending the moment the entity says the wind-down began,
    # instead of an empty canvas until the agent picks the command up.
    labels:
      entity: deployment
      operation: finalize
      scope.provider: "@context:scope.provider"
  groups:
    - {key: finalize, title: Finalize}
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    trace: false
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/deployment/build_context"
    trace: false
    output:
      - name: CONTEXT
        type: environment
      - name: SCOPE_VISIBILITY
        type: environment
      - name: SCOPE_DOMAIN
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: DEPLOYMENT_ID
        type: environment
      - name: BLUE_DEPLOYMENT_ID
        type: environment
  - name: build green deployment
    trace:
      title: Promote new deployment
      description: Scales the new version up to full capacity before the old one is removed.
      # ROLLING ONLY: every other strategy takes its instance counts from the
      # manifests, so this step has nothing to do and never enters their plan.
      flavors: [rolling]
      group: finalize
    type: script
    file: "$SERVICE_PATH/deployment/scale_deployments"
    post:
      name: wait deployment active
      type: script
      file: "$SERVICE_PATH/deployment/wait_deployment_active"
      trace:
        key: finalize-instances-check
        # The same wait, in THIS phase's words: full capacity must be healthy
        # before the previous version is removed.
        title: Verify final capacity
        description: Confirms every instance of the new version is healthy before the old one goes away.
        group: finalize
      configuration:
        TIMEOUT: DEPLOYMENT_MAX_WAIT_IN_SECONDS
        SKIP_DEPLOYMENT_STATUS_CHECK: true
  - name: route traffic
    trace:
      title: Configure ingress
      description: Rewrites the routing rules so the new version owns the scope's address.
      group: finalize
    type: script
    file: "$SERVICE_PATH/deployment/networking/gateway/route_traffic"
    configuration:
      TEMPLATE: "$INGRESS_TEMPLATE"
  - name: apply traffic
    trace:
      title: Apply final routing
      description: Puts the rewritten routing live.
      group: finalize
    type: script
    file: "$SERVICE_PATH/apply_templates"
    configuration:
      ACTION: apply
      DRY_RUN: false
    output:
      - name: INGRESS_FILE
        type: file
        file: "$OUTPUT_DIR/ingress-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
    post:
      name: post_apply_checks
      type: workflow
      steps:
        - name: verify_networking_reconciliation
          trace:
            title: Verify networking
            description: Waits for the load balancer to report the new routing as settled.
            group: finalize
          type: script
          file: "$SERVICE_PATH/deployment/verify_networking_reconciliation"
          configuration:
            # Wait until the ALB routes exclusively to the new deployment before the
            # blue deployment is deleted below. Weights cannot express this state.
            EXPECT_SINGLE_TARGET_GROUP: true
        - name: publish_alb_metrics
          trace: false
          type: script
          file: "$SERVICE_PATH/deployment/publish_alb_metrics"
  - name: build deployment
    trace: false
    type: script
    file: "$SERVICE_PATH/deployment/build_blue_deployment"
    output:
      - name: DEPLOYMENT_PATH
        type: file
        file: "$OUTPUT_DIR/deployment-$SCOPE_ID-$BLUE_DEPLOYMENT_ID.yaml"
      - name: SECRET_PATH
        type: file
        file: "$OUTPUT_DIR/secret-$SCOPE_ID-$BLUE_DEPLOYMENT_ID.yaml"
      - name: SCALING_PATH
        type: file
        file: "$OUTPUT_DIR/scaling-$SCOPE_ID-$BLUE_DEPLOYMENT_ID.yaml"
      - name: SERVICE_TEMPLATE_PATH
        type: file
        file: "$OUTPUT_DIR/service-$SCOPE_ID-$BLUE_DEPLOYMENT_ID.yaml"
  - name: delete deployment
    trace:
      title: Remove previous deployment
      description: Deletes the old version's workload, now that nothing routes to it.
      group: finalize
    type: script
    file: "$SERVICE_PATH/apply_templates"
    configuration:
      ACTION: delete
      DRY_RUN: false
    post:
      name: delete_cluster_objects
      type: script
      file: "$SERVICE_PATH/deployment/delete_cluster_objects"
      configuration:
        DEPLOYMENT: blue
