include:
  - "$SERVICE_PATH/values.yaml"
configuration:
  INGRESS_TEMPLATE: "$INITIAL_INGRESS_PATH"
trace:
  title: Roll back deployment
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE", "@context:providers.scope-configurations.deployment.deployment_strategy"]
  default: false
  job:
    name: k8s-deployment-rollback
    namespace: "@context:scope.provider"
    labels:
      entity: deployment
      operation: rollback
      scope.provider: "@context:scope.provider"
  groups:
    - {key: finalize, title: Finalize}
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    trace: false
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/deployment/build_context"
    trace: false
    output:
      - name: CONTEXT
        type: environment
      - name: SCOPE_VISIBILITY
        type: environment
      - name: SCOPE_DOMAIN
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: DEPLOYMENT_ID
        type: environment
      - name: BLUE_DEPLOYMENT_ID
        type: environment
  - name: update blue deployment
    type: script
    file: "$SERVICE_PATH/deployment/scale_deployments"
    trace:
      title: Restore previous deployment
      description: Scales the previous version back up to full capacity.
      flavors: [rolling]
      group: finalize
  - name: rollback traffic
    trace:
      title: Restore traffic routing
      description: Rewrites the routing rules to send traffic back to the previous version.
      group: finalize
    type: script
    file: "$SERVICE_PATH/deployment/networking/gateway/rollback_traffic"
    configuration:
      TEMPLATE: "$INGRESS_TEMPLATE"
    output:
      - name: INGRESS_FILE
        type: file
        file: "$OUTPUT_DIR/ingress-$SCOPE_ID-$BLUE_DEPLOYMENT_ID.yaml"
  - name: apply traffic
    trace:
      title: Apply routing
      description: Puts the restored routing live.
      group: finalize
    type: script
    file: "$SERVICE_PATH/apply_templates"
    configuration:
      ACTION: apply
      DRY_RUN: false
    post:
      name: verify_networking_reconciliation
      type: script
      file: "$SERVICE_PATH/deployment/verify_networking_reconciliation"
      configuration:
        # Wait until the ALB routes exclusively to the deployment being restored before
        # the failed deployment is deleted below. Weights cannot express this state.
        EXPECT_SINGLE_TARGET_GROUP: true
  - name: build deployment
    trace: false
    type: script
    file: "$SERVICE_PATH/deployment/build_deployment"
    output:
      - name: DEPLOYMENT_PATH
        type: file
        file: "$OUTPUT_DIR/deployment-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
      - name: SECRET_PATH
        type: file
        file: "$OUTPUT_DIR/secret-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
      - name: SCALING_PATH
        type: file
        file: "$OUTPUT_DIR/scaling-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
      - name: SERVICE_TEMPLATE_PATH
        type: file
        file: "$OUTPUT_DIR/service-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
  - name: delete deployment
    trace:
      title: Remove new deployment
      description: Deletes the version being rolled back, now that nothing routes to it.
      group: finalize
    type: script
    file: "$SERVICE_PATH/apply_templates"
    configuration:
      ACTION: delete
      DRY_RUN: false
    post:
      name: delete_cluster_objects
      type: script
      file: "$SERVICE_PATH/deployment/delete_cluster_objects"
      configuration:
        DEPLOYMENT: green
  - name: print_deployment_error_hints
    trace: false
    type: script
    file: "$SERVICE_PATH/deployment/print_failed_deployment_hints"
