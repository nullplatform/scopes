include:
  - "$SERVICE_PATH/values.yaml"
trace:
  title: Remove deployment
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE"]
  default: false
  job:
    name: k8s-deployment-delete
    namespace: "@context:scope.provider"
    labels:
      entity: deployment
      operation: delete
      scope.provider: "@context:scope.provider"
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    trace: false
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: azure identity
    type: script
    file: "$SERVICE_PATH/utils/azure_identity_step"
    trace: false
    output:
      - name: AZURE_CLIENT_ID
        type: environment
      - name: AZURE_CLIENT_SECRET
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/deployment/build_context"
    trace: false
    output:
      - name: CONTEXT
        type: environment
      - name: K8S_NAMESPACE
        type: environment
      - name: SCOPE_VISIBILITY
        type: environment
      - name: SCOPE_DOMAIN
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: DEPLOYMENT_ID
        type: environment
      - name: BLUE_DEPLOYMENT_ID
        type: environment
  - name: delete ingress finalizer
    type: script
    trace: false
    file: "$SERVICE_PATH/deployment/delete_ingress_finalizer"
  - name: route traffic
    type: script
    file: "$SERVICE_PATH/scope/networking/gateway/build_gateway"
    trace: false
    configuration:
      TEMPLATE: "$INITIAL_INGRESS_PATH"
    output:
      - name: INGRESS_FILE
        type: file
        file: "$OUTPUT_DIR/ingress-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
  - name: build deployment
    type: script
    file: "$SERVICE_PATH/deployment/build_deployment"
    trace: false
    output:
      - name: DEPLOYMENT_PATH
        type: file
        file: "$OUTPUT_DIR/deployment-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
      - name: SECRET_PATH
        type: file
        file: "$OUTPUT_DIR/secret-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
      - name: SCALING_PATH
        type: file
        file: "$OUTPUT_DIR/scaling-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
      - name: SERVICE_TEMPLATE_PATH
        type: file
        file: "$OUTPUT_DIR/service-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
  - name: delete deployment
    trace:
      title: Remove deployment
      description: Deletes the deployment's workload and the scope's routing rules.
    type: script
    file: "$SERVICE_PATH/apply_templates"
    configuration:
      ACTION: delete
      DRY_RUN: false
    post:
      name: delete_cluster_objects
      type: script
      file: "$SERVICE_PATH/deployment/delete_cluster_objects"
      configuration:
        DEPLOYMENT: green
  - name: remove service-to-service objects
    trace:
      title: Remove service-to-service objects
      description: Deletes the scope's stable in-cluster name and its internal routes, if any are left.
    type: script
    file: "$SERVICE_PATH/deployment/networking/gateway/cleanup_service_to_service"
    configuration:
      SERVICE_TO_SERVICE_REMOVE_ALL: "true"