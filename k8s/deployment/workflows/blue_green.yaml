include:
  - "$SERVICE_PATH/deployment/workflows/initial.yaml"
configuration:
  INGRESS_TEMPLATE: "$BLUE_GREEN_INGRESS_PATH"
trace:
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE"]
  # The job's identity labels are how the deployment page FINDS this plan
  # before any run exists (the pending checklist on a fresh deployment):
  # the page queries entity + strategy + the scope's provider (the service
  # specification id — stable across every scope this agent serves).
  job:
    name: k8s-deployment-blue-green
    labels:
      entity: deployment
      strategy: blue_green
      scope.provider: "@context:scope.provider"
  groups:
    - {key: setting-up, title: Setting up}
    - {key: waiting-instances, title: Waiting for instances to be healthy}
    # Declared with no steps here on purpose: PLACEHOLDER stations the later
    # workflows (switch_traffic, finalize) fill — the line shows the whole
    # journey pending from the first paint, exactly like a native scope.
    - {key: switching-traffic, title: Switching traffic}
    - {key: finalize, title: Finalize}
steps:
  # No milestone title: scaling is a no-op for blue-green (counts ride the
  # manifests; the script skips itself) and technical detail for rolling —
  # native's Setting up declares no scaling milestone either.
  - name: update blue deployment
    type: script
    file: "$SERVICE_PATH/deployment/scale_deployments"
    after: create deployment