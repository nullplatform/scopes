include:
  - "$SERVICE_PATH/deployment/workflows/initial.yaml"
configuration:
  INGRESS_TEMPLATE: "$BLUE_GREEN_INGRESS_PATH"
trace:
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE"]
  job: k8s-deployment-blue-green
  groups:
    - {key: setting-up, title: Setting up}
    - {key: waiting-instances, title: Waiting for instances to be healthy}
    # Declared with no steps here on purpose: PLACEHOLDER stations the later
    # workflows (switch_traffic, finalize) fill — the line shows the whole
    # journey pending from the first paint, exactly like a native scope.
    - {key: switching-traffic, title: Switching traffic}
    - {key: finalize, title: Finalize}
steps:
  - name: update blue deployment
    type: script
    file: "$SERVICE_PATH/deployment/scale_deployments"
    trace:
      title: Prepare previous deployment
    after: create deployment