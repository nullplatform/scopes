trace:
  # What a HUMAN calls this execution. It lands on the run's explain.title — the
  # first rung of every consumer's naming contract. Without it a consumer has only
  # the run id, and prints its own neutral word: this run rendered as
  # "Activity · N steps", which names nothing the reader can act on.
  title: Diagnose the failed deployment
continue_on_error: true
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: load_functions
    type: script
    file: "$SERVICE_PATH/diagnose/utils/diagnose_utils"
    trace: false
    output:
      - name: update_check_result
        type: function
        parameters:
          status: string
          evidence: object
      - name: notify_results
        type: function
  - name: build context
    type: script
    file: "$SERVICE_PATH/diagnose/build_context"
    trace: false
    output:
      - name: CONTEXT
        type: environment
      - name: LABEL_SELECTOR
        type: environment
  - name: diagnose
    type: executor
    before_each:
      name: notify_check_running
      type: script
      file: "$SERVICE_PATH/diagnose/notify_check_running"
      # Bookkeeping around each check — the CHECKS are the diagnosis's story;
      # two notify steps per check would triple every disclosure.
      trace: false
    after_each:
      name: notify_check_results
      type: script
      file: "$SERVICE_PATH/diagnose/notify_diagnose_results"
      trace: false
    folders:
      - "$SERVICE_PATH/diagnose/service"
      - "$SERVICE_PATH/diagnose/scope"
      - "$SERVICE_PATH/diagnose/networking"
      - "$SERVICE_PATH/diagnose/logs"