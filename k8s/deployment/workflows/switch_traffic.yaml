include:
  - "$SERVICE_PATH/values.yaml"
configuration:
  INGRESS_TEMPLATE: "$BLUE_GREEN_INGRESS_PATH"
# Trace identities speak the platform's deploy step vocabulary. Step NAMES
# never change — overrides anchor on them.
trace:
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE"]
  job: k8s-deployment-switch-traffic
  groups:
    - {key: setting-up, title: Setting up}
    - {key: waiting-instances, title: Waiting for instances to be healthy}
    - {key: switching-traffic, title: Switching traffic}
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    trace: false
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/deployment/build_context"
    trace: false
    output:
      - name: CONTEXT
        type: environment
      - name: SCOPE_VISIBILITY
        type: environment
      - name: SCOPE_DOMAIN
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: DEPLOYMENT_ID
        type: environment
      - name: BLUE_DEPLOYMENT_ID
        type: environment
  - name: create deployment
    type: script
    file: "$SERVICE_PATH/deployment/scale_deployments"
    trace:
      title: Scale green deployment
      group: setting-up
    post:
      name: wait deployment active
      type: script
      file: "$SERVICE_PATH/deployment/wait_deployment_active"
      trace:
        key: wait-for-instances
        title: Instance health check
        group: waiting-instances
      configuration:
        TIMEOUT: DEPLOYMENT_MAX_WAIT_IN_SECONDS
  - name: route traffic
    type: script
    file: "$SERVICE_PATH/deployment/networking/gateway/route_traffic"
    trace: false
    configuration:
      type: ingress
      TEMPLATE: "$INGRESS_TEMPLATE"
    output:
      - name: INGRESS_FILE
        type: file
        file: "$OUTPUT_DIR/ingress-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
  - name: update blue deployment
    type: script
    file: "$SERVICE_PATH/deployment/scale_deployments"
    trace:
      group: setting-up
  - name: apply traffic
    type: script
    file: "$SERVICE_PATH/apply_templates"
    trace:
      key: traffic-switch
      title: Switch traffic
      group: switching-traffic
    configuration:
      ACTION: apply
      DRY_RUN: false
    post:
      name: post_apply_checks
      type: workflow
      steps:
        - name: verify_networking_reconciliation
          type: script
          file: "$SERVICE_PATH/deployment/verify_networking_reconciliation"
          trace:
            group: switching-traffic
            flavors: [route53, external_dns]
          configuration:
            VERIFY_WEIGHTS: true
        - name: publish_alb_metrics
          type: script
          file: "$SERVICE_PATH/deployment/publish_alb_metrics"
          trace:
            flavors: [route53]
