include:
  - "$SERVICE_PATH/values.yaml"
configuration:
  INGRESS_TEMPLATE: "$BLUE_GREEN_INGRESS_PATH"
# Trace identities speak the platform's deploy step vocabulary. Step NAMES
# never change — overrides anchor on them.
trace:
  flavors: ["$K8S_FLAVOR", "$DNS_TYPE"]
  # This workflow runs ONCE PER TRAFFIC INCREMENT (ten times in a 10%-step
  # switch): declared steps only, so injected/override plumbing can never
  # multiply into noise on the wire.
  default: false
  # Per-provider identity: jobs are scoped to the scope's service
  # specification, so two providers sharing a workflow name never
  # converge on one definition.
  job:
    name: k8s-deployment-switch-traffic
    namespace: "@context:scope.provider"
  groups:
    - {key: switching-traffic, title: Switching traffic}
steps:
  - name: load logging
    type: script
    file: "$SERVICE_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    trace: false
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/deployment/build_context"
    trace: false
    output:
      - name: CONTEXT
        type: environment
      - name: SCOPE_VISIBILITY
        type: environment
      - name: SCOPE_DOMAIN
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: DEPLOYMENT_ID
        type: environment
      - name: BLUE_DEPLOYMENT_ID
        type: environment
  # Scaling is a no-op for blue-green (counts ride the manifests) and runs
  # once per increment — no milestone; the post's health check is the story.
  - name: create deployment
    type: script
    file: "$SERVICE_PATH/deployment/scale_deployments"
    post:
      name: wait deployment active
      type: script
      file: "$SERVICE_PATH/deployment/wait_deployment_active"
      trace:
        key: switch-instances-check
        # The same wait, in THIS phase's words: green must hold its scaled
        # replicas healthy before any weight shifts.
        title: Verify scaled instances
        group: switching-traffic
      configuration:
        TIMEOUT: DEPLOYMENT_MAX_WAIT_IN_SECONDS
  - name: route traffic
    type: script
    file: "$SERVICE_PATH/deployment/networking/gateway/route_traffic"
    trace: false
    configuration:
      type: ingress
      TEMPLATE: "$INGRESS_TEMPLATE"
    output:
      - name: INGRESS_FILE
        type: file
        file: "$OUTPUT_DIR/ingress-$SCOPE_ID-$DEPLOYMENT_ID.yaml"
  # Same no-op-for-blue-green scaling — untraced under default: false.
  - name: update blue deployment
    type: script
    file: "$SERVICE_PATH/deployment/scale_deployments"
  - name: apply traffic
    type: script
    file: "$SERVICE_PATH/apply_templates"
    trace:
      key: traffic-switch
      title: Switch traffic
      group: switching-traffic
    configuration:
      ACTION: apply
      DRY_RUN: false
      TRACE_TRAFFIC_SWITCH: true
    post:
      name: post_apply_checks
      type: workflow
      steps:
        - name: verify_networking_reconciliation
          type: script
          file: "$SERVICE_PATH/deployment/verify_networking_reconciliation"
          trace:
            title: Verify networking
            group: switching-traffic
            flavors: [route53, external_dns]
          configuration:
            VERIFY_WEIGHTS: true
        # Metrics publishing is machine bookkeeping, once per increment.
        - name: publish_alb_metrics
          type: script
          file: "$SERVICE_PATH/deployment/publish_alb_metrics"
          trace: false
