apiVersion: v1
kind: Service
metadata:
  name: d-scope-123-deploy-456
  namespace: ns-test
  labels:
    name: d-scope-123-deploy-456
    app.kubernetes.io/part-of: app
    app.kubernetes.io/component: application
    app.kubernetes.io/instance: scopeslug
    app.kubernetes.io/name: scopeslug
    account: acct
    account_id: "acc1"
    namespace: nsps
    namespace_id: "ns1"
    application: appslug
    application_id: "app1"
    scope: scopeslug
    scope_id: "scope-123"
    deployment_id: "deploy-456"
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: d-scope-123
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '5'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '1'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/success-codes: 200-299
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
  selector:
    nullplatform: "true"
    account: acct
    account_id: "acc1"
    namespace: nsps
    namespace_id: "ns1"
    application: appslug
    application_id: "app1"
    scope: scopeslug
    scope_id: "scope-123"
    deployment_id: "deploy-456"
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster




