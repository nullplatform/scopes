

apiVersion: apps/v1
kind: Deployment
metadata:
  name: d-scope-123-deploy-456
  namespace: ns-test
  labels:
    name: d-scope-123-deploy-456
    app.kubernetes.io/part-of: nsps
    account: acct
    account_id: "acc1"
    namespace: nsps
    namespace_id: "ns1"
    application: appslug
    application_id: "app1"
    scope: scopeslug
    scope_id: "scope-123"
    deployment_id: "deploy-456"
spec:
  replicas: 1
  selector:
    matchLabels:
      name: d-scope-123-deploy-456
  template:
    metadata:
      labels:
        name: d-scope-123-deploy-456
        app.kubernetes.io/part-of: app
        nullplatform: "true"
        account: "acct"
        account_id: "acc1"
        namespace: "nsps"
        namespace_id: "ns1"
        application: "appslug"
        application_id: "app1"
        scope: "scopeslug"
        scope_id: "scope-123"
        deployment_id: "deploy-456"
      annotations:
        nullplatform.logs.cloudwatch: 'true'
        nullplatform.logs.cloudwatch.log_group_name: nsps.appslug
        nullplatform.logs.cloudwatch.log_stream_log_retention_days: '7'
        nullplatform.logs.cloudwatch.log_stream_name_pattern: >-
          type=${type};application=app1;scope=scope-123;deploy=deploy-456;instance=${instance};container=${container}
        nullplatform.logs.cloudwatch.region: us-east-1
    spec:
      containers:
        - name: http
          securityContext:
            runAsUser: 0
          image: example.com/traffic:latest
          volumeMounts:
              - name: nginx-config
                mountPath: /etc/nginx/nginx.conf
                subPath: nginx.conf
              - name: nginx-config
                mountPath: /etc/nginx/conf.d/default.conf
                subPath: default.conf
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: LISTENER_PORT
              value: '80'
            - name: UPSTREAM_PORT
              value: '8080'
            - name: HEALTH_CHECK_TYPE
              value: http
            - name: GRACE_PERIOD
              value: '15'
            - name: LISTENER_PROTOCOL
              value: http
            - name: HEALTH_CHECK_PATH
              value: /health
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 31m
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 9
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 90
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always

        
        
        
        - name: grpc-9090
          securityContext:
            runAsUser: 0
          image: example.com/traffic:latest
          ports:
            - containerPort: 19090
              protocol: TCP
          env:
            - name: UPSTREAM_PORT
              value: '9090'
            - name: HEALTH_CHECK_TYPE
              value: grpc
            - name: GRACE_PERIOD
              value: '15'
            - name: LISTENER_PROTOCOL
              value: grpc
            - name: LISTENER_PORT
              value: '19090'
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 31m
          livenessProbe:
            grpc:
              port: 19090
            timeoutSeconds: 5
            periodSeconds: 10
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 9
          readinessProbe:
            grpc:
              port: 19090
            timeoutSeconds: 5
            periodSeconds: 10
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            grpc:
              port: 19090
            timeoutSeconds: 5
            periodSeconds: 10
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 90
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
        
        
        
        - name: application
          envFrom:
            - secretRef:
                name: s-scope-123-d-deploy-456
          image: >-
            example.com/app:latest
          securityContext:
            runAsUser: 0
          ports:
            - containerPort: 8080
              protocol: TCP
            
            
            - containerPort: 9090
              protocol: TCP
            
            
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            initialDelaySeconds: 5
            successThreshold: 1
            failureThreshold: 90
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - '16'
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          volumeMounts:
      volumes:
      - name: nginx-config
        configMap:
          name: cm-scope-123
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              name: d-scope-123-deploy-456
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
