include:
  - "$SERVICE_PATH/values.yaml"
provider_categories:
  - container-orchestration
  - cloud-providers
trace:
  job: scheduled-task-trigger
steps:
  - name: load logging
    type: script
    file: "$OVERRIDES_PATH/logging"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: trigger
    type: script
    file: "$OVERRIDES_PATH/scope/trigger"
